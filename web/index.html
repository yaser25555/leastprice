  <script>
    // Suppress noisy 3rd-party and extension errors in console
    (function() {
      const originalError = console.error;
      const originalWarn = console.warn;
      const noise = [
        'webextension.js',
        'AbortError',
        'connection was closed',
        'prepareServiceWorker',
        'OneSignalSDK',
        'Event handler of \'message\' event',
        'TypeError: Cannot read properties of null (reading \'1\')'
      ];

      function isNoise(args) {
        try {
          const msg = Array.from(args).map(a => String(a)).join(' ');
          return noise.some(n => msg.includes(n));
        } catch (e) { return false; }
      }

      console.error = function() {
        if (isNoise(arguments)) return;
        originalError.apply(console, arguments);
      };

      console.warn = function() {
        if (isNoise(arguments)) return;
        originalWarn.apply(console, arguments);
      };

      window.addEventListener('error', (e) => {
        if (e.message && noise.some(n => e.message.includes(n))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);

      window.addEventListener('unhandledrejection', (e) => {
        const reason = String(e.reason || '');
        if (reason.includes('AbortError') || noise.some(n => reason.includes(n))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    })();
  </script>

  <script>
    const versionInfoUrl = 'version.json';
    const versionStorageKey = 'leastprice_web_build_version';

    async function getRemoteVersionKey() {
      try {
        const response = await fetch(`${versionInfoUrl}?t=${Date.now()}`, {
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
        });
        if (!response.ok) return 'fallback-' + Date.now();
        const payload = await response.json();
        return [
          payload.app_name || 'leastprice',
          payload.version || '0',
          payload.build_number || '0',
        ].join('@');
      } catch (e) { return 'error-' + Date.now(); }
    }

    async function clearFlutterWebCaches() {
      try {
        // Unregister ALL service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            await reg.unregister();
          }
        }
        // Delete ALL caches
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
          }
        }
      } catch (_) {}
    }

    async function bootLatestVersion() {
      let bootTriggered = false;

      const triggerBoot = (vKey) => {
        if (bootTriggered) return;
        bootTriggered = true;
        
        const script = document.createElement('script');
        // Aggressive Cache Busting: version key + timestamp
        script.src = `flutter_bootstrap.js?v=${encodeURIComponent(vKey)}&t=${Date.now()}`;
        script.async = true;
        document.body.appendChild(script);

        // Initialize OneSignal AFTER Flutter starts to avoid worker conflicts
        setTimeout(() => {
          if (window.OneSignalDeferred) {
            window.OneSignalDeferred.push(async function(OneSignal) {
              try {
                await OneSignal.init({
                  appId: "715316fc-13d0-4fee-b0f8-860b4d38dee6",
                  safari_web_id: "web.onesignal.auto.5b1b15a7-d107-41ff-b02e-c379c8847bd2",
                  notifyButton: { enable: false },
                  allowLocalhostAsSecureOrigin: true,
                });
              } catch (e) {}
            });
          }
        }, 4000);
      };

      // Failsafe: if anything hangs, boot after 2.5 seconds anyway
      const failsafe = setTimeout(() => triggerBoot('failsafe-' + Date.now()), 2500);

      try {
        const remoteVersionKey = await getRemoteVersionKey();
        const previousVersionKey = localStorage.getItem(versionStorageKey);

        // If version changed, clear EVERYTHING before booting
        if (previousVersionKey !== remoteVersionKey) {
          await clearFlutterWebCaches();
          localStorage.setItem(versionStorageKey, remoteVersionKey);
        }
        
        clearTimeout(failsafe);
        triggerBoot(remoteVersionKey);
      } catch (e) {
        clearTimeout(failsafe);
        triggerBoot('error-' + Date.now());
      }
    }

    bootLatestVersion();
  </script>
