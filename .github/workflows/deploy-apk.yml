name: Deploy LeastPrice APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Increment Version
        run: |
          pip install PyYAML
          python scripts/increment_version.py
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version [skip ci]" || echo "No changes to commit"
          git push

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare signing (from GitHub Secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android signing secrets (ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD)."
            exit 1
          fi

          # Decode keystore and create key.properties used by android/app/build.gradle
          # Some UIs wrap base64 across lines/spaces. Normalize before decoding.
          printf "%s" "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r\t ' | base64 -d > android/app/leastprice-upload-keystore.jks

          cat > android/app/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=leastprice-upload-keystore.jks
          EOF

      - name: Prepare Firebase google-services.json (from GitHub Secrets)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Missing Firebase config secret GOOGLE_SERVICES_JSON_BASE64."
            exit 1
          fi

          printf "%s" "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r\t ' | base64 -d > android/app/google-services.json

      - name: Build APK (release)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: >
          flutter build apk --release 
          --dart-define=SERPAPI_KEY="$SERPAPI_KEY" 
          --dart-define=SERPER_API_KEY="$SERPER_API_KEY" 
          --dart-define=ADMIN_PASSWORD="$ADMIN_PASSWORD" 
          --dart-define=TAVILY_API_KEY="$TAVILY_API_KEY"

      - name: Prepare stable APK name
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/leastprice.apk

      - name: Publish GitHub Release (latest)
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Latest APK (v${{ github.run_number }})
          files: build/app/outputs/flutter-apk/leastprice.apk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyYAML firebase-admin

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          payload = os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"]
          target = Path(os.environ["RUNNER_TEMP"]) / "leastprice-service-account.json"
          target.write_text(payload, encoding="utf-8")

          github_env = Path(os.environ["GITHUB_ENV"])
          with github_env.open("a", encoding="utf-8") as handle:
              handle.write(f"GOOGLE_APPLICATION_CREDENTIALS={target}\n")
          PY

      - name: Update Firestore with new version
        run: |
          python scripts/update_app_version.py --url "https://github.com/yaser25555/leastprice/releases/download/apk-${{ github.run_number }}/leastprice.apk"

